<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<!--
  ==========================================================================
  AaraMinds Diagram Template — POLICY LENS (Diagram 2 of 3)
  Same token system + header/footer lockups as the Architecture Lens.
  Tier ramp is semantic: Tier1 teal -> Tier2 blue -> Tier3 amber -> Tier4 orange -> Tier5 red.
  (Green is reserved for outcomes/success, never a tier badge.)
  Edit tokens in :root; edit labels in the SVG; screenshot at 2x or Print > PDF.
  Companion spec: AaraMinds_Diagram_Style_Guide_v1.0.md
  ==========================================================================
-->
<style>
  :root{
    --canvas:#FFFFFF; --surface:#F6F8FB; --ink:#1E2A4A; --slate:#5A6480;
    --teal:#159E9E; --blue:#2F6FD0; --purple:#6E45A8; --green:#2E9E63;
    --amber:#E1912E; --orange:#DD7A33; --red:#D6473F; --hair:#D9E0EA; --road:#E7F2F2;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#EEF1F5;font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
  .bar{max-width:1400px;margin:22px auto 0;padding:12px 18px;background:#fff;border:1px solid var(--hair);border-radius:12px;font-size:13px;color:var(--slate);line-height:1.5;}
  .bar b{color:var(--ink);}
  .card{max-width:1400px;margin:16px auto 40px;background:var(--canvas);border:1px solid var(--hair);border-radius:16px;box-shadow:0 10px 34px rgba(30,42,74,.10);overflow:hidden;}
  svg{display:block;width:100%;height:auto;}
  .kicker{font:600 20px "Inter",sans-serif;letter-spacing:1.6px;fill:var(--slate);}
  .title{font:800 44px "Inter",sans-serif;fill:var(--ink);}
  .subtitle{font:500 25px "Inter",sans-serif;font-style:italic;fill:var(--slate);}
  .th{font:600 13px "Inter",sans-serif;letter-spacing:1px;fill:var(--slate);}
  .catname{font:700 21px "Inter",sans-serif;fill:var(--ink);}
  .ex{font:500 16px "Inter",sans-serif;fill:var(--slate);}
  .ctrl{font:500 15.5px "Inter",sans-serif;fill:var(--ink);}
  .badge{font:700 22px "Inter",sans-serif;fill:#fff;}
  .principle{font:700 20px "Inter",sans-serif;fill:var(--ink);}
  .wordmark{font:800 22px "Inter",sans-serif;fill:var(--ink);}
  .tag{font:600 12.5px "Inter",sans-serif;letter-spacing:.5px;fill:var(--slate);}
</style>
</head>
<body>

<div class="bar"><b>AaraMinds diagram template — Policy Lens.</b> Edit colors in <b>:root</b>, labels in the SVG, then screenshot at 2× or Print → PDF. This bar is not part of the diagram.</div>
