<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{ --canvas:#e1e2e7;--surface:#d9dde8;--boxfill:#eef0f6;--ink:#343b58;--slate:#565f89;--teal:#118c74;--blue:#2e7de9;--purple:#7847bd;--green:#587539;--amber:#8c6c3e;--orange:#b15c00;--red:#f52a65;--hair:#b4b9d1;--road:#d6ddef;--roadline:#118c74 }
*{box-sizing:border-box}
body{margin:0;background:#c4c8da;font-family:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.card{max-width:1400px;margin:16px auto;background:var(--canvas);border:1px solid var(--hair);border-radius:16px;box-shadow:0 10px 34px rgba(30,42,74,.10);overflow:hidden}
svg{display:block;width:100%;height:auto}
.kicker{font:600 20px Inter,sans-serif;letter-spacing:1.6px;fill:var(--slate)}
.title{font:800 44px Inter,sans-serif;fill:var(--ink)}
.subtitle{font:500 25px Inter,sans-serif;font-style:italic;fill:var(--slate)}
.zone{font:700 20px Inter,sans-serif;fill:var(--ink)}
.steplbl{font:700 17px Inter,sans-serif;fill:var(--ink)}
.stepsub{font:500 13px Inter,sans-serif;fill:var(--slate)}
.pitem{font:600 15px Inter,sans-serif;fill:var(--ink)}
.badge{font:700 19px Inter,sans-serif;fill:#fff}
.chip{font:600 13.5px Inter,sans-serif;fill:var(--ink)}
.label{font:600 17px Inter,sans-serif;fill:var(--ink)}
.gate{font:500 15.5px Inter,sans-serif;fill:var(--ink)}
.panel{fill:var(--surface);stroke:var(--hair);stroke-width:1.5}
.box{fill:var(--boxfill);stroke:var(--hair);stroke-width:1.5}
</style></head><body><div class="card"><svg viewBox="0 0 1600 1030" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink)"/></marker></defs><rect x="0" y="0" width="1600" height="1030" fill="var(--canvas)"/><text class="kicker" x="800" y="52" text-anchor="middle">MCP GOVERNANCE SERIES — PART 6</text><text class="title" x="800" y="98" text-anchor="middle">DIAGRAM 1 of 2 — AI RUNTIME GOVERNANCE STACK</text><line x1="712" y1="116" x2="888" y2="116" stroke="var(--teal)" stroke-width="3" stroke-linecap="round"/><text class="subtitle" x="800" y="150" text-anchor="middle">The seven layers that govern how an AI system acts</text><text x="800" y="182" text-anchor="middle" font-family="Inter" font-weight="500" font-size="15.5" font-style="italic" fill="var(--slate)">The Part 4 paved road, generalized beyond MCP — the same primitives across the whole execution path.</text><rect x="110" y="204" width="1380" height="32" rx="16" fill="var(--surface)" stroke="var(--hair)" stroke-width="1.5"/><text x="800" y="225" text-anchor="middle" font-family="Inter" font-weight="700" font-size="14.5" letter-spacing="0.5" fill="var(--slate)">AN AGENT ACTS  ↓  the request enters the governed runtime</text><text transform="rotate(-90 78 520)" x="78" y="520" text-anchor="middle" font-family="Inter" font-weight="700" font-size="13" letter-spacing="2" fill="var(--slate)">THE GOVERNED RUNTIME</text><rect x="110" y="250" width="1380" height="74" rx="12" fill="var(--boxfill)" stroke="var(--slate)" stroke-width="1.5"/><rect x="110" y="250" width="7" height="74" rx="3.5" fill="var(--slate)"/><circle cx="160" cy="287.0" r="21" fill="var(--slate)"/><text x="160" y="294.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="19" fill="#fff">1</text><text x="204" y="282" font-family="Inter" font-weight="700" font-size="21" fill="var(--ink)">Agent identity</text><text x="204" y="306" font-family="Inter" font-weight="500" font-size="14.5" fill="var(--slate)">Which agent, on whose behalf, under what authority.</text><line x1="748" y1="265" x2="748" y2="309" stroke="var(--hair)" stroke-width="1.5"/><rect x="768" y="273.0" width="50" height="28" rx="8" fill="var(--teal)" opacity="0.13"/><text x="793" y="292.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11.5" letter-spacing="0.5" fill="var(--teal)">GATE</text><text x="836" y="292.0" font-family="Inter" font-weight="500" font-size="15.5" fill="var(--ink)">Who is acting, and under what authority?</text><rect x="110" y="331" width="1380" height="74" rx="12" fill="var(--boxfill)" stroke="var(--teal)" stroke-width="1.5"/><rect x="110" y="331" width="7" height="74" rx="3.5" fill="var(--teal)"/><circle cx="160" cy="368.0" r="21" fill="var(--teal)"/><text x="160" y="375.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="19" fill="#fff">2</text><text x="204" y="363" font-family="Inter" font-weight="700" font-size="21" fill="var(--ink)">Tool & capability registry</text><text x="204" y="387" font-family="Inter" font-weight="500" font-size="14.5" fill="var(--slate)">System of record: tools, owners, scopes, risk tiers.</text><line x1="748" y1="346" x2="748" y2="390" stroke="var(--hair)" stroke-width="1.5"/><rect x="768" y="354.0" width="50" height="28" rx="8" fill="var(--teal)" opacity="0.13"/><text x="793" y="373.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11.5" letter-spacing="0.5" fill="var(--teal)">GATE</text><text x="836" y="373.0" font-family="Inter" font-weight="500" font-size="15.5" fill="var(--ink)">What capabilities exist, who owns them, and what can they reach?</text><rect x="110" y="412" width="1380" height="74" rx="12" fill="var(--boxfill)" stroke="var(--purple)" stroke-width="2.5"/><rect x="113" y="415" width="1374" height="68" rx="10" fill="var(--purple)" opacity="0.09"/><rect x="110" y="412" width="7" height="74" rx="3.5" fill="var(--purple)"/><circle cx="160" cy="449.0" r="21" fill="var(--purple)"/><text x="160" y="456.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="19" fill="#fff">3</text><text x="204" y="444" font-family="Inter" font-weight="700" font-size="21" fill="var(--ink)">Runtime control plane</text><text x="204" y="468" font-family="Inter" font-weight="500" font-size="14.5" fill="var(--slate)">The load-bearing layer between agents and tools.</text><rect x="556" y="427" width="126" height="24" rx="12" fill="var(--purple)"/><text x="619" y="443" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#fff">LOAD-BEARING</text><line x1="748" y1="427" x2="748" y2="471" stroke="var(--hair)" stroke-width="1.5"/><rect x="768" y="435.0" width="50" height="28" rx="8" fill="var(--teal)" opacity="0.13"/><text x="793" y="454.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11.5" letter-spacing="0.5" fill="var(--teal)">GATE</text><text x="836" y="454.0" font-family="Inter" font-weight="500" font-size="15.5" fill="var(--ink)">Can every high-risk action pass through a governed control point?</text><rect x="110" y="493" width="1380" height="74" rx="12" fill="var(--boxfill)" stroke="var(--teal)" stroke-width="1.5"/><rect x="110" y="493" width="7" height="74" rx="3.5" fill="var(--teal)"/><circle cx="160" cy="530.0" r="21" fill="var(--teal)"/><text x="160" y="537.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="19" fill="#fff">4</text><text x="204" y="525" font-family="Inter" font-weight="700" font-size="21" fill="var(--ink)">Policy & approval orchestration</text><text x="204" y="549" font-family="Inter" font-weight="500" font-size="14.5" fill="var(--slate)">The lightest control that fits the risk.</text><line x1="748" y1="508" x2="748" y2="552" stroke="var(--hair)" stroke-width="1.5"/><rect x="768" y="516.0" width="50" height="28" rx="8" fill="var(--teal)" opacity="0.13"/><text x="793" y="535.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11.5" letter-spacing="0.5" fill="var(--teal)">GATE</text><text x="836" y="535.0" font-family="Inter" font-weight="500" font-size="15.5" fill="var(--ink)">Does the runtime apply the lightest control that fits the risk?</text><rect x="110" y="574" width="1380" height="74" rx="12" fill="var(--boxfill)" stroke="var(--slate)" stroke-width="1.5"/><rect x="110" y="574" width="7" height="74" rx="3.5" fill="var(--slate)"/><circle cx="160" cy="611.0" r="21" fill="var(--slate)"/><text x="160" y="618.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="19" fill="#fff">5</text><text x="204" y="606" font-family="Inter" font-weight="700" font-size="21" fill="var(--ink)">Context return controls</text><text x="204" y="630" font-family="Inter" font-weight="500" font-size="14.5" fill="var(--slate)">Content safety and redaction on what returns.</text><line x1="748" y1="589" x2="748" y2="633" stroke="var(--hair)" stroke-width="1.5"/><rect x="768" y="597.0" width="50" height="28" rx="8" fill="var(--teal)" opacity="0.13"/><text x="793" y="616.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11.5" letter-spacing="0.5" fill="var(--teal)">GATE</text><text x="836" y="616.0" font-family="Inter" font-weight="500" font-size="15.5" fill="var(--ink)">What information is allowed to re-enter model reasoning?</text><rect x="110" y="655" width="1380" height="74" rx="12" fill="var(--boxfill)" stroke="var(--teal)" stroke-width="1.5"/><rect x="110" y="655" width="7" height="74" rx="3.5" fill="var(--teal)"/><circle cx="160" cy="692.0" r="21" fill="var(--teal)"/><text x="160" y="699.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="19" fill="#fff">6</text><text x="204" y="687" font-family="Inter" font-weight="700" font-size="21" fill="var(--ink)">Observability & lineage</text><text x="204" y="711" font-family="Inter" font-weight="500" font-size="14.5" fill="var(--slate)">Reconstruct the full execution path, not just logs.</text><line x1="748" y1="670" x2="748" y2="714" stroke="var(--hair)" stroke-width="1.5"/><rect x="768" y="678.0" width="50" height="28" rx="8" fill="var(--teal)" opacity="0.13"/><text x="793" y="697.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11.5" letter-spacing="0.5" fill="var(--teal)">GATE</text><text x="836" y="697.0" font-family="Inter" font-weight="500" font-size="15.5" fill="var(--ink)">Can we reconstruct what happened after the fact?</text><rect x="110" y="736" width="1380" height="74" rx="12" fill="var(--boxfill)" stroke="var(--slate)" stroke-width="1.5"/><rect x="110" y="736" width="7" height="74" rx="3.5" fill="var(--slate)"/><circle cx="160" cy="773.0" r="21" fill="var(--slate)"/><text x="160" y="780.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="19" fill="#fff">7</text><text x="204" y="768" font-family="Inter" font-weight="700" font-size="21" fill="var(--ink)">Evidence & review</text><text x="204" y="792" font-family="Inter" font-weight="500" font-size="14.5" fill="var(--slate)">Runtime proof that updates future governance.</text><line x1="748" y1="751" x2="748" y2="795" stroke="var(--hair)" stroke-width="1.5"/><rect x="768" y="759.0" width="50" height="28" rx="8" fill="var(--teal)" opacity="0.13"/><text x="793" y="778.0" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11.5" letter-spacing="0.5" fill="var(--teal)">GATE</text><text x="836" y="778.0" font-family="Inter" font-weight="500" font-size="15.5" fill="var(--ink)">Does runtime evidence change future governance behavior?</text><rect x="110" y="820" width="1380" height="32" rx="16" fill="var(--surface)" stroke="var(--hair)" stroke-width="1.5"/><text x="800" y="841" text-anchor="middle" font-family="Inter" font-weight="700" font-size="14.5" letter-spacing="0.5" fill="var(--slate)">GOVERNED EXECUTION  ↓  tools · APIs · downstream syste
